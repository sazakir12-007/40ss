<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
  <meta name="theme-color" content="#0f5c4d">
  <meta name="description" content="As-Salatu was-Salam – 40 salawat and salaam upon the Prophet ﷺ to recite daily, offline.">
  <title>As-Salatu was-Salam</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <h1>As-Salatu was-Salam</h1>
    <div class="menu-wrap">
      <button class="icon-btn" id="menuBtn" aria-label="Menu" aria-haspopup="menu">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <div class="menu" id="menu" role="menu" hidden>
        <button role="menuitem" id="openSettings">Settings</button>
        <button role="menuitem" id="openAbout">About</button>
        <button role="menuitem" id="shareApp">Share app</button>
      </div>
    </div>
    <div class="auto-bar" id="autoBar"></div>
  </header>

  <main id="main"></main>

  <div class="page-pos" id="pagePos"></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <button class="fab play" id="autoBtn" aria-label="Start auto scroll">
    <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
  </button>
  <div class="fab-stack">
    <button class="fab" id="toTop" aria-label="Scroll to top" hidden>
      <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <button class="fab" id="toBottom" aria-label="Scroll to bottom" hidden>
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <dialog id="settings">
    <form method="dialog">
      <h2>Settings</h2>
      <p class="hint">Tap any durood to mark it while you recite; the app remembers your place. Use ▶ to move through them automatically.</p>
      <label>Theme
        <select id="themeSel">
          <option value="auto">System</option>
          <option value="light">Light</option>
          <option value="sepia">Sepia</option>
          <option value="ocean">Ocean</option>
          <option value="rose">Rose</option>
          <option value="lavender">Lavender</option>
          <option value="emerald">Emerald</option>
          <option value="dark">Dark</option>
          <option value="midnight">Midnight</option>
          <option value="black">Black (AMOLED)</option>
        </select>
      </label>
      <label>Reading
        <select id="dirSel">
          <option value="vertical">Vertical (scroll down)</option>
          <option value="horizontal">Sideways (swipe left → right)</option>
        </select>
      </label>
      <fieldset class="fonts">
        <legend>Arabic font</legend>
        <label class="font-opt"><input type="radio" name="font" value="amiri"><span class="sample" style="font-family: Amiri">صَلِّ عَلَى مُحَمَّدٍ</span><span class="fname">Amiri</span></label>
        <label class="font-opt"><input type="radio" name="font" value="scheherazade"><span class="sample" style="font-family: 'Scheherazade New'">صَلِّ عَلَى مُحَمَّدٍ</span><span class="fname">Scheherazade</span></label>
        <label class="font-opt"><input type="radio" name="font" value="noto-naskh"><span class="sample" style="font-family: 'Noto Naskh Arabic'">صَلِّ عَلَى مُحَمَّدٍ</span><span class="fname">Noto Naskh</span></label>
        <label class="font-opt"><input type="radio" name="font" value="lateef"><span class="sample" style="font-family: Lateef">صَلِّ عَلَى مُحَمَّدٍ</span><span class="fname">Lateef</span></label>
        <label class="font-opt"><input type="radio" name="font" value="system"><span class="sample" style="font-family: 'Traditional Arabic', 'Geeza Pro', serif">صَلِّ عَلَى مُحَمَّدٍ</span><span class="fname">Device default</span></label>
      </fieldset>
      <label>Arabic size <span id="sizeVal"></span>
        <input type="range" id="sizeRange" min="20" max="48" step="2">
      </label>
      <label>Auto scroll – time per durood
        <select id="autoSel">
          <option value="10">10 seconds</option>
          <option value="15">15 seconds</option>
          <option value="20">20 seconds</option>
          <option value="30">30 seconds</option>
          <option value="45">45 seconds</option>
          <option value="60">1 minute</option>
          <option value="90">1½ minutes</option>
          <option value="120">2 minutes</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="showTr"> Show transliteration</label>
      <label class="check"><input type="checkbox" id="showEn"> Show translation</label>
      <label class="check"><input type="checkbox" id="showSrc"> Show source &amp; benefits</label>
      <button class="primary">Done</button>
    </form>
  </dialog>

  <dialog id="about">
    <form method="dialog">
      <h2>About</h2>
      <div id="aboutBody" class="about-body"></div>
      <button class="primary">Close</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
