<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
  <meta name="theme-color" content="#0f5c4d">
  <meta name="description" content="Chahal Durood – 40 Salawat & Salaam to recite daily, offline.">
  <title>40 Salawat &amp; Salaam</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <h1>40 Salawat &amp; Salaam</h1>
    <div class="menu-wrap">
      <button class="icon-btn" id="menuBtn" aria-label="Menu" aria-haspopup="menu">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      </button>
      <div class="menu" id="menu" role="menu" hidden>
        <button role="menuitem" id="openSettings">Theme &amp; display</button>
        <button role="menuitem" id="openAbout">About</button>
      </div>
    </div>
  </header>

  <main id="main"></main>

  <button class="to-top" id="toTop" aria-label="Scroll to top" hidden>
    <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
  </button>

  <dialog id="settings">
    <form method="dialog">
      <h2>Theme &amp; display</h2>
      <label>Theme
        <select id="themeSel">
          <option value="auto">System</option>
          <option value="light">Light</option>
          <option value="sepia">Sepia</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <label>Arabic size <span id="sizeVal"></span>
        <input type="range" id="sizeRange" min="20" max="48" step="2">
      </label>
      <label class="check"><input type="checkbox" id="showTr"> Show transliteration</label>
      <label class="check"><input type="checkbox" id="showEn"> Show translation</label>
      <label class="check"><input type="checkbox" id="showSrc"> Show source &amp; benefits</label>
      <button class="primary">Done</button>
    </form>
  </dialog>

  <dialog id="about">
    <form method="dialog">
      <h2>About</h2>
      <div id="aboutBody" class="about-body"></div>
      <button class="primary">Close</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
